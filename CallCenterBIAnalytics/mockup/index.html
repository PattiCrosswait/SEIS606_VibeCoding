<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nutrition Photo Analyzer</title>
    <meta
      name="description"
      content="Upload a meal photo and receive a guarded nutrition estimate with uncertainty and failure handling."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="nutrition-shell">
      <section class="nutrition-card" aria-labelledby="nutrition-title">
        <header class="nutrition-header">
          <div>
            <p class="eyebrow">nutrition intake</p>
            <h1 id="nutrition-title">Photo nutrition analysis</h1>
          </div>
          <span class="status-pill">estimate only</span>
        </header>

        <div class="upload-panel">
          <div class="upload-copy">
            <p>Upload a single photo of a meal to receive a cautious nutrition estimate.</p>
            <ul>
              <li>Supported formats: JPEG, PNG, WebP</li>
              <li>Max size: 8 MB</li>
              <li>Results remain estimates and may be rejected when evidence is weak.</li>
            </ul>
          </div>

          <form id="uploadForm" class="upload-form" novalidate>
            <label class="upload-dropzone" for="photoInput" data-nutrition-upload>
              <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" />
              <span class="dropzone-icon">⇪</span>
              <strong>Choose a photo</strong>
              <small>JPG, PNG, or WebP file</small>
            </label>
            <div class="submission-row">
              <button id="analyzeButton" type="submit" class="primary-button">Analyze photo</button>
              <button id="resetButton" type="button" class="secondary-button">Clear</button>
            </div>
          </form>
        </div>

        <div id="statusBanner" class="status-banner" aria-live="polite"></div>

        <section id="resultPanel" class="result-panel is-hidden" aria-live="polite"></section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
